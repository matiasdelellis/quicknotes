name: quicknotes

services:
  db:
    image: mariadb:11.4
    container_name: quicknotes-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: nextcloud:32
    container_name: quicknotes-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${NEXTCLOUD_HTTP_PORT}:80"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MARIADB_DATABASE}
      MYSQL_USER: ${MARIADB_USER}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      NEXTCLOUD_OVERWRITEPROTOCOL: ${NEXTCLOUD_OVERWRITEPROTOCOL}
    volumes:
      - nc:/var/www/html
      - ../:/var/www/html/custom_apps/quicknotes:z
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/status.php"]
      interval: 30s
      timeout: 10s
      retries: 5

  builder:
    image: node:20-bookworm
    container_name: quicknotes-builder
    working_dir: /app
    volumes:
      - ../:/app:z
      - npm_cache:/root/.npm
    command: ["sh", "-c", "echo 'Use docker/scripts/build.sh to trigger the build' && sleep infinity"]

volumes:
  db:
    name: quicknotes_db
  nc:
    name: quicknotes_nc
  npm_cache:
    name: quicknotes_npm_cache
