# Local development stack for the Quick notes Nextcloud app.
# See ../docker/README.md for usage instructions.
name: quicknotes

services:
  # MariaDB 11.4 — backing store for Nextcloud.
  db:
    image: mariadb:11.4
    container_name: quicknotes-db
    restart: unless-stopped
    # READ-COMMITTED + ROW-based binlog are the settings recommended by Nextcloud
    # for use with MariaDB / MySQL.
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Nextcloud — the application server. The repository is bind-mounted into
  # custom_apps/quicknotes so changes to the code are picked up live. The
  # `:z` SELinux relabeling option is required when SELinux is in Enforcing mode.
  app:
    image: nextcloud:34
    container_name: quicknotes-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${NEXTCLOUD_HTTP_PORT}:80"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MARIADB_DATABASE}
      MYSQL_USER: ${MARIADB_USER}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      NEXTCLOUD_OVERWRITEPROTOCOL: ${NEXTCLOUD_OVERWRITEPROTOCOL}
    volumes:
      - nc:/var/www/html
      # Mount the parent directory (the repository root) into the Nextcloud
      # custom_apps folder. The leading `../` steps out of this `docker/`
      # directory so the whole project ends up in the right place.
      - ../:/var/www/html/custom_apps/quicknotes:z
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/status.php"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Node 20 — used solely to build the front-end assets. Trigger the build
  # with `docker/scripts/build.sh`. The container stays idle (`sleep infinity`)
  # between builds; dependencies and the npm cache are persisted via the
  # `npm_cache` volume.
  builder:
    image: node:20-bookworm
    container_name: quicknotes-builder
    working_dir: /app
    volumes:
      - ../:/app:z
      - npm_cache:/root/.npm
    command: ["sh", "-c", "echo 'Use docker/scripts/build.sh to trigger the build' && sleep infinity"]

  # Dev/test image: a checkout of nextcloud/server with `composer install`
  # already done at build time (see docker/Dockerfile.dev), so phpunit is
  # available at /var/www/html/lib/composer/bin/phpunit. The repo is
  # bind-mounted at /var/www/html/apps/quicknotes (the canonical dev path
  # — required so phpunit's bootstrap resolves ../../../tests/bootstrap.php).
  #
  # Auto-installs with sqlite so it does not share a database with `app`.
  # Bring it up explicitly with `docker compose up -d dev` and run the tests
  # via `./docker/scripts/test.sh`.
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NEXTCLOUD_DEV_BRANCH: ${NEXTCLOUD_DEV_BRANCH:-stable34}
    container_name: quicknotes-dev
    restart: unless-stopped
    ports:
      - "${NEXTCLOUD_DEV_HTTP_PORT:-8081}:80"
    environment:
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_DEV_TRUSTED_DOMAINS:-localhost}
      NEXTCLOUD_OVERWRITEPROTOCOL: ${NEXTCLOUD_OVERWRITEPROTOCOL:-http}
    volumes:
      - nc-dev:/var/www/html
      - ../:/var/www/html/apps/quicknotes:z
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/status.php"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  db:
    name: quicknotes_db
  nc:
    name: quicknotes_nc
  npm_cache:
    name: quicknotes_npm_cache
  nc-dev:
    name: quicknotes_nc_dev
