name: Frontend lint

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  frontend-linters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Lint JavaScript and Vue
        run: npm run lint
      - name: Lint stylesheets
        run: npm run stylelint
